[project]
name = "tmc-processor"
version = "1.0.1"
description = "Streamlit application for processing Turning Movement Count Excel files."
requires-python = ">=3.10"
dependencies = [
  "altair>=5",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "streamlit>=1.37",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
excel-com = [
  "pywin32>=306; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tmc_processor*"]
