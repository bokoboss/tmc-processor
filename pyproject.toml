[project]
name = "tmc-processor"
version = "0.2.0"
description = "Streamlit MVP for processing Turning Movement Count Excel files."
requires-python = ">=3.10"
dependencies = [
  "altair>=5",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "streamlit>=1.32",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tmc_processor*"]
